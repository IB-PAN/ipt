name: Build container image
on:
  push:
    branches:
      - ibpan

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

          echo "GIT_REVISION=$(git rev-parse --verify --short=7 HEAD)" >> ${GITHUB_ENV}

          echo '<settings></settings>' > package/docker/m2-settings.xml
          mkdir -p /home/runner/.m2/repository

      - uses: actions/cache@v6
        with:
          path: /home/runner/.m2/repository
          key: ${{ runner.os }}-maven

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            ./package/docker/Dockerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.DEFAULT_TAG }}
          oci: true
          build-args: |
            GIT_REVISION=${{ env.GIT_REVISION }}
          extra-args: |
            --volume=/home/runner/.m2/repository:/root/.m2/repository:U,Z,shared

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
          extra-args: |
            --disable-content-trust
            --compression-format=zstd:chunked
            --force-compression=true
